<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moon HR Smart Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #f0f2f5;
      --surface:   #ffffff;
      --border:    #e2e6ea;
      --text:      #1a1d21;
      --sub:       #6b7280;
      --accent1:   #3AA9F6;
      --accent2:   #3C50C1;
      --accent3:   #A03BEF;
      --accent4:   #441F7D;
      --radius: 14px;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
      --shadow-hover: 0 8px 30px rgba(0,0,0,0.13);
      --transition: 0.22s cubic-bezier(.4,0,.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .layout { display: flex; min-height: 100vh; }

    /* ── 사이드바 ── */
    .sidebar {
      width: 220px;
      background: var(--accent4);
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 28px 0 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-logo { padding: 0 22px 28px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-logo .brand { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
    .sidebar-logo .sub { font-size: 0.72rem; color: rgba(255,255,255,0.55); margin-top: 2px; letter-spacing: 0.5px; }
    .sidebar-nav { padding: 20px 12px 0; flex: 1; }
    .sidebar-nav-label { font-size: 0.65rem; font-weight: 600; color: rgba(255,255,255,0.4); letter-spacing: 1.5px; text-transform: uppercase; padding: 0 10px; margin-bottom: 8px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: 8px; cursor: pointer; font-size: 0.88rem; font-weight: 500; color: rgba(255,255,255,0.75); transition: var(--transition); text-decoration: none; margin-bottom: 2px; }
    .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.12); color: #fff; }
    .nav-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .sidebar-footer { padding: 16px 22px 0; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.72rem; color: rgba(255,255,255,0.35); }

    /* ── 메인 ── */
    .main { flex: 1; padding: 36px 40px; max-width: 1100px; }
    .topbar { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; }
    .topbar h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.8px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .date-chip { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--sub); background: var(--surface); border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px; }

    /* 새로고침 버튼 */
    .refresh-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; font-weight: 600;
      color: var(--accent2);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 13px; border-radius: 20px;
      cursor: pointer; transition: var(--transition);
      font-family: 'Noto Sans KR', sans-serif;
    }
    .refresh-btn:hover { background: var(--accent2); color: #fff; border-color: var(--accent2); }
    .refresh-btn.loading { opacity: 0.6; pointer-events: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 0.8s linear infinite; }

    /* 연결 상태 배지 */
    .status-badge {
      font-size: 0.72rem; padding: 4px 10px; border-radius: 20px;
      font-weight: 600; display: flex; align-items: center; gap: 5px;
    }
    .status-badge.ok  { background: #dcfce7; color: #16a34a; }
    .status-badge.err { background: #fee2e2; color: #dc2626; }
    .status-badge.loading { background: #f3f4f6; color: #6b7280; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* 검색바 */
    .search-wrap { margin-bottom: 30px; position: relative; }
    .search-wrap input { width: 100%; padding: 13px 18px 13px 44px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 0.92rem; font-family: 'Noto Sans KR', sans-serif; background: var(--surface); color: var(--text); transition: var(--transition); outline: none; }
    .search-wrap input:focus { border-color: var(--accent1); box-shadow: 0 0 0 3px rgba(58,169,246,0.13); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--sub); font-size: 1rem; pointer-events: none; }

    /* 섹션 & 카드 */
    .section { margin-bottom: 40px; }
    .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .cat-badge { display: inline-flex; align-items: center; gap: 7px; font-size: 0.82rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; color: #fff; }
    .count { font-size: 0.78rem; color: var(--sub); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; transition: var(--transition); display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: transparent; }
    .card-top { display: flex; align-items: center; gap: 10px; }
    .card-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
    .card-name { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.3px; line-height: 1.3; }
    .card-desc { font-size: 0.8rem; color: var(--sub); line-height: 1.5; }
    .card-memo { background: #f8fafc; border: 1px solid #eef0f2; border-radius: 8px; padding: 8px 11px; font-family: 'DM Mono', monospace; font-size: 0.76rem; color: #4b5563; line-height: 1.6; }
    .pw-val { color: transparent; text-shadow: 0 0 7px rgba(0,0,0,0.4); cursor: pointer; transition: 0.2s; }
    .pw-val:hover { color: var(--accent2); text-shadow: none; }
    .pw-label { color: var(--sub); }
    .card-link-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 600; color: var(--accent2); margin-top: auto; text-decoration: none; transition: var(--transition); }
    .card-link-btn:hover { opacity: 0.75; }

    /* 스켈레톤 로딩 */
    .skeleton-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-bottom: 40px; }
    .skeleton-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; height: 140px; }
    .skeleton-line { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; margin-bottom: 10px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* 에러/빈 상태 */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--sub); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    .error-box { background: #fff5f5; border: 1px solid #fecaca; border-radius: var(--radius); padding: 20px 24px; color: #dc2626; font-size: 0.88rem; line-height: 1.7; margin-bottom: 24px; }
    .error-box strong { display: block; margin-bottom: 6px; font-size: 1rem; }
    .error-box code { background: #fee2e2; padding: 2px 6px; border-radius: 4px; font-family: 'DM Mono', monospace; font-size: 0.82rem; }

    @media (max-width: 768px) { .sidebar { display: none; } .main { padding: 24px 18px; } .grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<!-- =============================================
  🔧 설정 구역 — GAS URL만 여기에 붙여넣으세요!
============================================= -->
<script>
// ✅ 2단계에서 복사한 GAS 웹앱 URL을 아래에 붙여넣으세요
const GAS_URL = "YOUR_GAS_WEBAPP_URL_HERE"; // Google Apps Script 웹앱 URL을 여기에 입력하세요

// 카테고리 정의 (스프레드시트의 Category 값과 일치해야 해요)
const CATEGORIES = [
  { name: "그룹웨어",        emoji: "🖥️", color: "#3AA9F6" },
  { name: "복리후생",        emoji: "🏖️", color: "#22c55e" },
  { name: "협력사 요청",     emoji: "🤝", color: "#f59e0b" },
  { name: "민원증명서 발급", emoji: "📋", color: "#ef4444" },
];
</script>

<!-- =============================================
  🔻 아래는 수정 불필요 (렌더링 코드)
============================================= -->

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="brand">AROM</div>
      <div class="sub">HR Smart Dashboard</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-nav-label">Categories</div>
      <a class="nav-item active" href="#" onclick="filterCat('',this);return false;">
        <span class="dot" style="background:#fff;opacity:.5;"></span> 전체 보기
      </a>
      <div id="nav-cats"></div>
    </nav>
    <div class="sidebar-footer">
      <div>© 2026 AROM 경영지원팀</div>
      <div style="margin-top:4px;">Moonjeah · HR Planner</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>HR 스마트 대시보드</h1>
      <div class="topbar-right">
        <span class="status-badge loading" id="statusBadge">
          <span class="status-dot"></span> 연결 중…
        </span>
        <span class="date-chip" id="today-date"></span>
        <button class="refresh-btn" id="refreshBtn" onclick="loadData()">
          <span id="refreshIcon">🔄</span> 새로고침
        </button>
      </div>
    </div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="사이트명, 메모 검색…" oninput="renderCards()" />
    </div>

    <div id="sections"></div>
  </main>
</div>

<script>
// ─── 날짜 ───────────────────────────────────────────
const d = new Date();
document.getElementById('today-date').textContent =
  `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${['일','월','화','수','목','금','토'][d.getDay()]}`;

// ─── 사이드바 nav 생성 ─────────────────────────────
CATEGORIES.forEach(cat => {
  const a = document.createElement('a');
  a.className = 'nav-item';
  a.href = '#';
  a.innerHTML = `<span class="dot" style="background:${cat.color}"></span> ${cat.emoji} ${cat.name}`;
  a.onclick = e => { e.preventDefault(); filterCat(cat.name, a); };
  document.getElementById('nav-cats').appendChild(a);
});


// ─── 포트폴리오 데모용 오프라인 데이터 ────────────────────────────
const DEMO_DATA = [
  { Category:"그룹웨어", Name:"전자결재 시스템", Emoji:"📝", Desc:"전사 기안·결재 관리", ID:"user@arom.com", PW:"", Memo:"그룹웨어 계정과 통합", URL:"#" },
  { Category:"그룹웨어", Name:"근태관리 포털", Emoji:"⏰", Desc:"출퇴근·휴가·초과근무 신청", ID:"", PW:"", Memo:"월 마감일 전 확인 필수", URL:"#" },
  { Category:"그룹웨어", Name:"메일 시스템", Emoji:"📧", Desc:"사내 이메일 · 일정 관리", ID:"user@arom.com", PW:"", Memo:"외부메일 수신 허용됨", URL:"#" },
  { Category:"복리후생", Name:"건강검진 신청", Emoji:"🏥", Desc:"연 1회 종합건강검진 예약", ID:"", PW:"", Memo:"3월 중 신청 마감", URL:"#" },
  { Category:"복리후생", Name:"복지포인트 몰", Emoji:"🎁", Desc:"복지카드 포인트 사용처", ID:"사번", PW:"", Memo:"연 120만P 지급", URL:"#" },
  { Category:"협력사 요청", Name:"세금계산서 발행", Emoji:"🧾", Desc:"협력사 계산서 수신 전용", ID:"", PW:"", Memo:"매월 25일 마감", URL:"#" },
  { Category:"협력사 요청", Name:"거래처 등록 신청", Emoji:"🤝", Desc:"신규 협력사 등록 요청 양식", ID:"", PW:"", Memo:"구매팀 경유 필수", URL:"#" },
  { Category:"민원증명서 발급", Name:"재직증명서 발급", Emoji:"📋", Desc:"온라인 재직증명서 즉시 발급", ID:"사번", PW:"", Memo:"공인인증서 필요", URL:"#" },
  { Category:"민원증명서 발급", Name:"경력증명서 발급", Emoji:"📄", Desc:"재직 경력 확인용", ID:"", PW:"", Memo:"HR팀 요청 후 1일 소요", URL:"#" },
];

// ─── 상태 관리 ─────────────────────────────────────
let allData   = [];
let activeCat = '';

function setStatus(type, text) {
  const b = document.getElementById('statusBadge');
  b.className = `status-badge ${type}`;
  b.innerHTML = `<span class="status-dot"></span> ${text}`;
}




// ─── GAS에서 데이터 로드 (포트폴리오: 오프라인 데모 모드) ───────────────────────
async function loadData() {
  const btn  = document.getElementById('refreshBtn');
  const icon = document.getElementById('refreshIcon');
  btn.classList.add('loading');
  icon.className = 'spin';
  icon.textContent = '🔄';
  setStatus('loading', '불러오는 중…');
  showSkeleton();

  // 포트폴리오 데모: GAS URL이 없으면 오프라인 더미 데이터 사용
  await new Promise(r => setTimeout(r, 600)); // 로딩 애니메이션
  try {
    if (!GAS_URL || GAS_URL.includes('YOUR_GAS')) {
      allData = DEMO_DATA;
      setStatus('ok', `데모 모드 · ${DEMO_DATA.length}개`);
      renderCards();
    } else {
      const res  = await fetch(GAS_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      allData = data;
      setStatus('ok', `연결됨 · ${data.length}개`);
      renderCards();
    }
  } catch (err) {
    // GAS 연결 실패 시 데모 데이터로 폴백
    allData = DEMO_DATA;
    setStatus('ok', `데모 모드 · ${DEMO_DATA.length}개`);
    renderCards();
  } finally {
    btn.classList.remove('loading');
    icon.className = '';
    icon.textContent = '🔄';
  }
}

// ─── 스켈레톤 로딩 ────────────────────────────────
function showSkeleton() {
  const sections = document.getElementById('sections');
  sections.innerHTML = [1,2].map(() => `
    <div class="skeleton-grid">
      ${[1,2,3].map(() => `
        <div class="skeleton-card">
          <div class="skeleton-line" style="width:40%;height:14px;"></div>
          <div class="skeleton-line" style="width:80%;height:10px;margin-top:14px;"></div>
          <div class="skeleton-line" style="width:65%;height:10px;"></div>
          <div class="skeleton-line" style="width:90%;height:32px;margin-top:8px;border-radius:8px;"></div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

// ─── 에러 표시 ────────────────────────────────────
function showError(msg) {
  document.getElementById('sections').innerHTML = `
    <div class="error-box">
      <strong>⚠️ 데이터를 불러오지 못했어요</strong>
      원인: <code>${msg}</code><br><br>
      확인 사항:<br>
      1. GAS_URL이 정확히 입력되어 있는지 확인하세요.<br>
      2. GAS 배포 시 액세스 권한을 <strong>"모든 사용자"</strong>로 설정했는지 확인하세요.<br>
      3. 스프레드시트 시트 이름이 <strong>"HR대시보드"</strong>인지 확인하세요.
    </div>
  `;
}

// ─── 필터 ─────────────────────────────────────────
function filterCat(catName, el) {
  activeCat = catName;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  renderCards();
}

// ─── 카드 렌더링 ────────────────────────────────────
function renderCards() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const sections = document.getElementById('sections');
  sections.innerHTML = '';

  const catsToShow = activeCat
    ? CATEGORIES.filter(c => c.name === activeCat)
    : CATEGORIES;

  let totalShown = 0;

  catsToShow.forEach(cat => {
    const items = allData.filter(row =>
      row['Category'] === cat.name &&
      (!q || (row['Name']||'').toLowerCase().includes(q) ||
              (row['Desc']||'').toLowerCase().includes(q) ||
              (row['Memo']||'').toLowerCase().includes(q))
    );
    if (!items.length) return;
    totalShown += items.length;

    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `
      <div class="section-header">
        <span class="cat-badge" style="background:${cat.color}">${cat.emoji} ${cat.name}</span>
        <span class="count">${items.length}개</span>
      </div>
      <div class="grid" id="grid-${cat.name}"></div>
    `;
    sections.appendChild(sec);

    const grid = sec.querySelector(`#grid-${CSS.escape(cat.name)}`);
    items.forEach(row => grid.appendChild(makeCard(row, cat)));
  });

  if (totalShown === 0 && allData.length > 0) {
    sections.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>"${q || activeCat}" 에 해당하는 항목이 없어요.</p></div>`;
  }
}

// ─── 카드 생성 ──────────────────────────────────────
function makeCard(row, cat) {
  const card = document.createElement('div');
  card.className = 'card';

  // 컬러 바
  const bar = document.createElement('div');
  bar.style.cssText = `position:absolute;top:0;left:0;width:3px;height:100%;background:${cat.color};border-radius:3px 0 0 3px;`;
  card.appendChild(bar);

  // 상단
  const top = document.createElement('div');
  top.className = 'card-top';
  top.innerHTML = `
    <div class="card-icon" style="background:${cat.color}22;color:${cat.color}">${row['Emoji']||'🔗'}</div>
    <div class="card-name">${row['Name']||''}</div>
  `;
  card.appendChild(top);

  if (row['Desc']) {
    const desc = document.createElement('div');
    desc.className = 'card-desc';
    desc.textContent = row['Desc'];
    card.appendChild(desc);
  }

  const memoLines = [];
  if (row['ID'])   memoLines.push(`<span class="pw-label">ID: </span>${row['ID']}`);
  if (row['PW'])   memoLines.push(`<span class="pw-label">PW: </span><span class="pw-val" title="클릭하면 복사" onclick="copyPw(this,'${row['PW']}')">${row['PW']}</span>`);
  if (row['Memo']) memoLines.push(`<span style="color:#9ca3af">✏️ ${row['Memo']}</span>`);

  if (memoLines.length) {
    const memo = document.createElement('div');
    memo.className = 'card-memo';
    memo.innerHTML = memoLines.join('<br>');
    card.appendChild(memo);
  }

  if (row['URL'] && row['URL'] !== '#') {
    const btn = document.createElement('a');
    btn.className = 'card-link-btn';
    btn.href = row['URL'];
    btn.target = '_blank';
    btn.rel = 'noopener noreferrer';
    btn.textContent = '바로가기 →';
    card.appendChild(btn);
  }

  card.addEventListener('mouseenter', () => { card.style.boxShadow = `0 8px 30px ${cat.color}25`; });
  card.addEventListener('mouseleave', () => { card.style.boxShadow = ''; });

  return card;
}

// ─── 비밀번호 복사 ─────────────────────────────────
function copyPw(el, pw) {
  navigator.clipboard.writeText(pw).then(() => {
    el.style.color = '#22c55e';
    el.style.textShadow = 'none';
    setTimeout(() => { el.style.color = ''; }, 1200);
  });
}
