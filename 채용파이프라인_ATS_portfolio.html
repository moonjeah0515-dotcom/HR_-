<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채용 파이프라인 ATS v2.0 · MOON HR Portfolio</title>
<style>
/* ═══ RESET & VARS ═══ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c1220;--bg2:#111827;--bg3:#1a2332;--bg4:#243044;
  --card:#161f2e;--card-hover:#1c2738;
  --border:#1e2d3d;--border2:#2a3a4d;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#3b82f6;--accent2:#2563eb;--accent-soft:rgba(59,130,246,.12);
  --green:#22c55e;--green-soft:rgba(34,197,94,.12);
  --amber:#f59e0b;--amber-soft:rgba(245,158,11,.12);
  --red:#ef4444;--red-soft:rgba(239,68,68,.12);
  --purple:#a855f7;--purple-soft:rgba(168,85,247,.12);
  --cyan:#06b6d4;--cyan-soft:rgba(6,182,212,.12);
  --mint:#22d3ae;
  --radius:8px;--radius-lg:12px;
  --shadow:0 4px 24px rgba(0,0,0,.3);
  --font:'Pretendard',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Fira Code',monospace;
}
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css');
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
button{font-family:var(--font);cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:var(--font);background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:7px 10px;font-size:12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:9px}

/* ═══ LAYOUT ═══ */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-brand{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.sidebar-brand h1{font-size:15px;font-weight:700;letter-spacing:-.3px}
.sidebar-brand h1 span{color:var(--accent)}
.sidebar-brand p{font-size:10px;color:var(--text3);margin-top:2px;letter-spacing:.5px;text-transform:uppercase}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;transition:.15s;margin-bottom:2px}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item .icon{width:18px;text-align:center;font-size:14px;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:1px 7px;border-radius:99px;font-weight:600}
.nav-divider{font-size:10px;color:var(--text3);padding:12px 12px 4px;letter-spacing:.8px;text-transform:uppercase;font-weight:600}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--text3)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-title{font-size:16px;font-weight:700}
.topbar-sub{font-size:11px;color:var(--text3)}
.topbar-actions{display:flex;align-items:center;gap:8px}

.content{flex:1;overflow-y:auto;padding:20px 24px}

/* ═══ BUTTONS ═══ */
.btn{padding:7px 14px;border-radius:var(--radius);font-size:12px;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red-soft);color:var(--red)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-icon:hover{border-color:var(--accent);color:var(--accent)}

/* ═══ TAGS ═══ */
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;letter-spacing:.3px}
.tag-blue{background:var(--accent-soft);color:var(--accent)}
.tag-green{background:var(--green-soft);color:var(--green)}
.tag-amber{background:var(--amber-soft);color:var(--amber)}
.tag-red{background:var(--red-soft);color:var(--red)}
.tag-purple{background:var(--purple-soft);color:var(--purple)}
.tag-cyan{background:var(--cyan-soft);color:var(--cyan)}

/* ═══ CARDS ═══ */
.stat-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.stat-card .label{font-size:11px;color:var(--text3);margin-bottom:6px}
.stat-card .value{font-size:24px;font-weight:700;line-height:1}
.stat-card .delta{font-size:11px;margin-top:4px}
.delta-up{color:var(--green)}.delta-down{color:var(--red)}

/* ═══ VIEW: PIPELINE (KANBAN) ═══ */
.pipeline-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-box{position:relative}
.search-box input{width:220px;padding-left:30px}
.search-box::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px}
.filter-group{display:flex;gap:6px;margin-left:auto}

.kanban{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;min-height:400px}
.kanban-col{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;min-height:300px}
.col-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.col-title{font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px}
.col-count{background:var(--bg4);color:var(--text2);font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600}
.col-body{flex:1;padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}

.k-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:.15s;position:relative}
.k-card:hover{border-color:var(--accent);background:var(--card-hover)}
.k-card.delayed{border-left:3px solid var(--amber)}
.k-card.critical{border-left:3px solid var(--red)}
.k-name{font-size:12px;font-weight:600;margin-bottom:3px}
.k-pos{font-size:11px;color:var(--text2)}
.k-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:10px;color:var(--text3)}
.k-channel{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--bg4)}
.k-dday{font-weight:600}
.k-dday.warn{color:var(--amber)}
.k-dday.danger{color:var(--red)}
.k-score{margin-left:auto;display:flex;align-items:center;gap:2px}
.k-score .star{color:var(--amber);font-size:10px}

/* ═══ DETAIL PANEL (SLIDE) ═══ */
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;opacity:0;pointer-events:none;transition:.25s}
.panel-overlay.open{opacity:1;pointer-events:all}
.detail-panel{position:fixed;top:0;right:-560px;width:560px;height:100vh;background:var(--bg2);border-left:1px solid var(--border);z-index:101;transition:.3s;display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,.4)}
.detail-panel.open{right:0}
.panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:16px}
.panel-close:hover{color:var(--red)}
.panel-body{flex:1;overflow-y:auto}
.panel-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 20px}
.panel-tab{padding:10px 16px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.panel-tab:hover{color:var(--text)}
.panel-tab.active{color:var(--accent);border-color:var(--accent)}
.panel-content{padding:20px}

/* Profile section */
.profile-top{display:flex;gap:16px;margin-bottom:20px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--accent);flex-shrink:0}
.profile-info h3{font-size:16px;font-weight:700;margin-bottom:2px}
.profile-info .pos{font-size:12px;color:var(--text2)}
.profile-info .stage-tag{margin-top:4px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.info-item{background:var(--bg3);border-radius:var(--radius);padding:10px 12px}
.info-item .il{font-size:10px;color:var(--text3);margin-bottom:3px}
.info-item .iv{font-size:13px;font-weight:500}

/* Timeline */
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;background:var(--border2)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:'';position:absolute;left:-17px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg2)}
.tl-item.comm::before{background:var(--green)}
.tl-item.stage::before{background:var(--purple)}
.tl-item.note::before{background:var(--amber)}
.tl-date{font-size:10px;color:var(--text3)}
.tl-text{font-size:12px;margin-top:2px}

/* Scorecard */
.sc-section{margin-bottom:16px}
.sc-title{font-size:11px;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.sc-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}
.sc-label{flex:1;font-size:12px}
.sc-stars{display:flex;gap:2px}
.sc-star{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;font-size:12px;background:var(--bg3);color:var(--text3);transition:.15s}
.sc-star.filled{background:var(--amber-soft);color:var(--amber)}
.sc-star:hover{background:var(--amber-soft);color:var(--amber)}
.sc-avg{font-size:20px;font-weight:700;color:var(--accent)}
.sc-interviewer{font-size:11px;color:var(--text2);margin-bottom:12px}

/* ═══ VIEW: POSTINGS ═══ */
.posting-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.posting-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;transition:.15s}
.posting-card:hover{border-color:var(--accent)}
.posting-card h3{font-size:14px;font-weight:700;margin-bottom:4px}
.posting-dept{font-size:11px;color:var(--text2);margin-bottom:10px}
.posting-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pm-item{font-size:11px}
.pm-item .pm-l{color:var(--text3)}
.pm-item .pm-v{font-weight:600}
.posting-channels{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.posting-pipeline{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.posting-pipeline .pp-bar{flex:1;height:6px;background:var(--bg4);border-radius:99px;overflow:hidden}
.posting-pipeline .pp-fill{height:100%;background:var(--accent);border-radius:99px;transition:.3s}
.posting-status{display:inline-block;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:600}
.ps-open{background:var(--green-soft);color:var(--green)}
.ps-closed{background:var(--red-soft);color:var(--red)}
.ps-draft{background:var(--bg4);color:var(--text3)}

/* ═══ VIEW: SCHEDULE ═══ */
.schedule-week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.day-col{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);min-height:200px}
.day-header{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;text-align:center}
.day-header.today{color:var(--accent);background:var(--accent-soft)}
.day-body{padding:8px}
.interview-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;margin-bottom:6px;font-size:11px}
.interview-card .iv-time{font-weight:700;color:var(--accent);margin-bottom:2px}
.interview-card .iv-name{font-weight:600;margin-bottom:2px}
.interview-card .iv-pos{color:var(--text2);font-size:10px}
.interview-card .iv-interviewer{color:var(--text3);font-size:10px;margin-top:4px}
.interview-card.done{opacity:.5;border-left:3px solid var(--green)}

/* ═══ VIEW: TALENT POOL ═══ */
.pool-table{width:100%;border-collapse:collapse}
.pool-table th{text-align:left;padding:10px 12px;font-size:11px;color:var(--text3);border-bottom:1px solid var(--border);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.pool-table td{padding:10px 12px;font-size:12px;border-bottom:1px solid var(--border)}
.pool-table tr:hover td{background:var(--bg3)}
.pool-tags{display:flex;gap:4px;flex-wrap:wrap}

/* ═══ VIEW: REPORTS ═══ */
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.report-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.report-card h4{font-size:13px;font-weight:700;margin-bottom:4px}
.report-card .rc-sub{font-size:11px;color:var(--text3);margin-bottom:16px}
.chart-container{position:relative;height:180px}
.funnel-chart{display:flex;flex-direction:column;gap:6px}
.funnel-row{display:flex;align-items:center;gap:10px}
.funnel-label{width:70px;font-size:11px;color:var(--text2);text-align:right}
.funnel-bar-wrap{flex:1;height:24px;background:var(--bg3);border-radius:4px;overflow:hidden}
.funnel-bar{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;min-width:28px;transition:.5s}
.funnel-count{width:30px;font-size:12px;font-weight:600;text-align:right}

.metric-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:12px}
.metric-big{font-size:36px;font-weight:700;line-height:1}
.metric-unit{font-size:12px;color:var(--text3);padding-bottom:4px}
.metric-bar{display:flex;gap:4px;margin-top:8px}
.m-bar{height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;min-width:40px}

/* Channel performance table */
.ch-table{width:100%;border-collapse:collapse;font-size:11px}
.ch-table th{text-align:left;padding:8px 10px;color:var(--text3);border-bottom:1px solid var(--border);font-weight:600}
.ch-table td{padding:8px 10px;border-bottom:1px solid var(--border)}
.ch-table .num{text-align:right;font-weight:600;font-family:var(--mono);font-size:11px}
.ch-bar{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;min-width:60px}
.ch-bar-fill{height:100%;border-radius:2px}

/* ═══ MODAL ═══ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);width:500px;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:15px;font-weight:700}
.modal-body{padding:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select,.form-group textarea{width:100%}
.form-group textarea{min-height:80px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ═══ ONBOARDING ═══ */
.onboard-list{display:flex;flex-direction:column;gap:6px}
.onboard-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg3);border-radius:var(--radius);font-size:12px}
.onboard-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.onboard-check.done{background:var(--green);border-color:var(--green);color:#fff;font-size:10px}

/* ═══ EMPTY STATE ═══ */
.empty-state{text-align:center;padding:40px;color:var(--text3)}
.empty-state .es-icon{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:13px}

/* ═══ PORTFOLIO BADGE ═══ */
.port-badge{position:fixed;bottom:16px;right:16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 14px;font-size:10px;color:var(--text3);z-index:50;display:flex;align-items:center;gap:8px}
.port-badge a{color:var(--accent);font-weight:600}

/* ═══ RESPONSIVE ═══ */
@media(max-width:1200px){.kanban{grid-template-columns:repeat(3,1fr)}.stat-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.sidebar{display:none}.kanban{grid-template-columns:repeat(2,1fr)}.stat-row{grid-template-columns:repeat(2,1fr)}.report-grid{grid-template-columns:1fr}.schedule-week{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <h1>MOON <span>ATS</span></h1>
      <p>Applicant Tracking System</p>
    </div>
    <div class="sidebar-nav">
      <div class="nav-divider">채용 운영</div>
      <div class="nav-item active" onclick="switchView('pipeline')">
        <span class="icon">📋</span> 파이프라인
        <span class="badge" id="nav-pipe-count">0</span>
      </div>
      <div class="nav-item" onclick="switchView('postings')">
        <span class="icon">📢</span> 공고 관리
      </div>
      <div class="nav-item" onclick="switchView('schedule')">
        <span class="icon">📅</span> 면접 일정
        <span class="badge" id="nav-schedule-count" style="background:var(--amber)">0</span>
      </div>
      <div class="nav-divider">인재 관리</div>
      <div class="nav-item" onclick="switchView('pool')">
        <span class="icon">💎</span> 탈렌트 풀
      </div>
      <div class="nav-divider">분석</div>
      <div class="nav-item" onclick="switchView('reports')">
        <span class="icon">📊</span> 리포트
      </div>
    </div>
    <div class="sidebar-footer">
      Portfolio Demo · 더미 데이터 기반<br>
      © 2026 MOON HR
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div>
          <div class="topbar-title" id="view-title">파이프라인</div>
          <div class="topbar-sub" id="view-sub">전형 단계별 지원자 현황</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-outline btn-sm" onclick="resetDemo()">🔄 데모 리셋</button>
        <button class="btn btn-primary btn-sm" onclick="openAddCandidate()">+ 지원자 등록</button>
      </div>
    </div>

    <div class="content" id="content">
      <!-- Views rendered by JS -->
    </div>
  </div>
</div>

<!-- DETAIL PANEL -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>
<div class="detail-panel" id="detailPanel">
  <div class="panel-header">
    <div style="font-size:14px;font-weight:700" id="panel-name">-</div>
    <div class="panel-close" onclick="closePanel()">✕</div>
  </div>
  <div class="panel-tabs">
    <div class="panel-tab active" onclick="switchPanelTab('profile',this)">프로필</div>
    <div class="panel-tab" onclick="switchPanelTab('scorecard',this)">평가</div>

<script>
// ═══════════════════════════════════════════════════════════

let DB = {candidates:[],postings:[],pool:[],interviews:[]};
let currentView='pipeline';
let selectedCandidate=null;

function generateDemoData(){
  const now=Date.now();

    cands.push({
      id:'c'+i, name:NAMES[i%NAMES.length], position:pos, channel:ch, dept:dept,
      stage:stage, applyDate:fmt(applyDate),
      phone:`010-${String(Math.floor(Math.random()*9000+1000))}-${String(Math.floor(Math.random()*9000+1000))}`,
      email:`${NAMES[i%NAMES.length].replace(/[^a-z]/gi,'')}${i}@example.com`,
      curSalary, expSalary,
      career:`${pos} ${Math.floor(Math.random()*5+1)}년 경력. ${['스타트업','중견기업','대기업'][Math.floor(Math.random()*3)]} 출신.`,
      resume:'https://example.com/resume',
      portfolio:Math.random()>.5?'https://example.com/portfolio':'',
      scores, timeline,
      onboarding: stage===5 ? [
        {text:'장비(노트북/모니터) 준비',done:Math.random()>.3},
        {text:'사내 계정 생성 (이메일/Slack/Jira)',done:Math.random()>.4},
        {text:'취업규칙 서명',done:Math.random()>.5},

        {text:'보안 교육 수료',done:false},
        {text:'첫 주 OJT 일정 공유',done:false}
      ] : []
    });

  DB.candidates=cands;

  // Postings
  DB.postings=[
    {id:'p1',title:'시니어 백엔드 개발자',dept:'개발팀',status:'open',channels:['원티드','링크드인','헤드헌팅'],openDate:'2026-04-01',closeDate:'2026-05-15',headcount:2,jd:'Java/Kotlin 기반 백엔드 개발 5년 이상. MSA 아키텍처 경험 필수.'},
    {id:'p2',title:'프론트엔드 개발자',dept:'개발팀',status:'open',channels:['사람인','원티드','내부추천'],openDate:'2026-04-10',closeDate:'2026-05-20',headcount:1,jd:'React/TypeScript 3년 이상. 디자인 시스템 구축 경험 우대.'},
    {id:'p3',title:'PM/PO',dept:'기획팀',status:'open',channels:['잡코리아','원티드','링크드인'],openDate:'2026-03-20',closeDate:'2026-05-10',headcount:1,jd:'IT 서비스 기획 3년 이상. 데이터 기반 의사결정 역량.'},
    {id:'p4',title:'UI/UX 디자이너',dept:'디자인팀',status:'closed',channels:['사람인','원티드'],openDate:'2026-02-01',closeDate:'2026-03-30',headcount:1,jd:'Figma 능숙. B2B SaaS 디자인 경험 우대.'},
    {id:'p5',title:'DevOps 엔지니어',dept:'개발팀',status:'draft',channels:[],openDate:'',closeDate:'',headcount:1,jd:'AWS/GCP 인프라 운영 경험. CI/CD 파이프라인 구축.'},
  ];

  // Talent Pool
  DB.pool=[
    {id:'t1',name:'최영호',position:'백엔드 개발',tags:['시니어','Java','서울'],source:'원티드',addedDate:'2026-03-15',note:'이번 라운드는 연봉 gap으로 불합격, 역량은 우수'},
    {id:'t2',name:'박소미',position:'디자이너(UI/UX)',tags:['주니어','Figma','포트폴리오 우수'],source:'사람인',addedDate:'2026-02-20',note:'현재 공고 마감으로 보류. 다음 디자인 포지션 오픈 시 우선 연락'},
    {id:'t3',name:'김태현',position:'프론트엔드 개발',tags:['미드레벨','React','리모트 희망'],source:'링크드인',addedDate:'2026-04-01',note:'기술 역량 Good. 출근 조건 불일치로 보류'},
    {id:'t4',name:'이가은',position:'PM/PO',tags:['시니어','B2B','SaaS'],source:'헤드헌팅',addedDate:'2026-01-10',note:'연봉 7000 이상 기대. 예산 확보 시 재접근'},
    {id:'t5',name:'정우성',position:'데이터 엔지니어',tags:['미드레벨','Python','Spark'],source:'내부추천',addedDate:'2026-03-28',note:'팀장 추천. 현재 포지션 미오픈, 하반기 채용 시 1순위'},

  // Interviews

  DB.interviews=[];
  const ivNames=['박지호','정현우','조예준','장도윤','강다은','임시우','신동현'];
  const interviewers=['김팀장','이CTO','박리드','최PM'];
  for(let d=0;d<5;d++){
    const cnt=Math.floor(Math.random()*3);
    for(let j=0;j<cnt;j++){
      const dt=new Date(mon);dt.setDate(mon.getDate()+d);
      const hour=10+Math.floor(Math.random()*6);
      DB.interviews.push({
        id:'iv'+d+j,
        candidateName:ivNames[Math.floor(Math.random()*ivNames.length)],
        position:POSITIONS[Math.floor(Math.random()*POSITIONS.length)],
        date:fmt(dt),
        time:`${hour}:00`,
        interviewer:interviewers[Math.floor(Math.random()*interviewers.length)],
        type:Math.random()>.5?'1차 기술면접':'2차 임원면접',

  }
  saveDB();
}

function fmt(d){return d.toISOString().split('T')[0]}
function daysBetween(a,b){return Math.floor((new Date(b)-new Date(a))/86400000)}
function saveDB(){try{localStorage.setItem('moon_ats_v2',JSON.stringify(DB))}catch(e){}}
function loadDB(){try{const d=localStorage.getItem('moon_ats_v2');if(d){DB=JSON.parse(d);return true}}catch(e){}return false}
function resetDemo(){localStorage.removeItem('moon_ats_v2');generateDemoData();render()}

// ═══════════════════════════════════════════════════════════
// VIEWS
// ═══════════════════════════════════════════════════════════
function switchView(v){
  currentView=v;
  document.querySelectorAll('.nav-item').forEach((el,i)=>{
    const views=['pipeline','postings','schedule','pool','reports'];
    el.classList.toggle('active',views[i]===v);
  });
  const titles={pipeline:['파이프라인','전형 단계별 지원자 현황'],postings:['공고 관리','포지션별 채용 공고 현황'],schedule:['면접 일정','이번 주 면접 스케줄'],pool:['탈렌트 풀','보류 후보자 관리'],reports:['리포트','채용 핵심 지표 분석']};
  document.getElementById('view-title').textContent=titles[v][0];
  document.getElementById('view-sub').textContent=titles[v][1];
  render();
}

function render(){
  const c=document.getElementById('content');
  switch(currentView){
    case 'pipeline': renderPipeline(c);break;
    case 'postings': renderPostings(c);break;
    case 'schedule': renderSchedule(c);break;
    case 'pool': renderPool(c);break;
    case 'reports': renderReports(c);break;
  }
  // Nav badges
  document.getElementById('nav-pipe-count').textContent=DB.candidates.filter(c=>c.stage<5).length;
  document.getElementById('nav-schedule-count').textContent=DB.interviews.filter(iv=>!iv.done).length;
}

// ─── PIPELINE VIEW ───
function renderPipeline(el){
  const today=fmt(new Date());
  const counts=STAGES.map((_,i)=>DB.candidates.filter(c=>c.stage===i).length);
  const total=DB.candidates.length;
  const active=DB.candidates.filter(c=>c.stage<5).length;
  const hired=DB.candidates.filter(c=>c.stage===5).length;
  const delayed=DB.candidates.filter(c=>{const d=daysBetween(c.applyDate,today);return c.stage<5&&d>14}).length;
  const avgDays=Math.round(DB.candidates.filter(c=>c.stage===5).reduce((s,c)=>s+daysBetween(c.applyDate,today),0)/(hired||1));
  const offerRate=total?Math.round(DB.candidates.filter(c=>c.stage>=4).length/total*100):0;

  el.innerHTML=`
    <div class="stat-row">
      <div class="stat-card"><div class="label">전체 지원자</div><div class="value">${total}</div><div class="delta delta-up">명</div></div>
      <div class="stat-card"><div class="label">진행중</div><div class="value" style="color:var(--accent)">${active}</div><div class="delta">명</div></div>
      <div class="stat-card"><div class="label">입사 확정</div><div class="value" style="color:var(--green)">${hired}</div><div class="delta delta-up">명</div></div>
      <div class="stat-card"><div class="label">지연 건수</div><div class="value" style="color:${delayed>0?'var(--amber)':'var(--text)'}">${delayed}</div><div class="delta ${delayed>0?'delta-down':''}">D+14 초과</div></div>
      <div class="stat-card"><div class="label">평균 채용 소요</div><div class="value">${avgDays}</div><div class="delta">일</div></div>
      <div class="stat-card"><div class="label">오퍼 전환율</div><div class="value">${offerRate}%</div><div class="delta">접수 대비</div></div>
    </div>
    <div class="pipeline-header">
      <div class="search-box"><input placeholder="이름 · 포지션 검색" oninput="filterPipeline(this.value)"></div>
      <div class="filter-group">
        <select onchange="filterByDept(this.value)" style="font-size:11px;padding:5px 8px"><option value="">전체 부서</option>${DEPTS.map(d=>`<option>${d}</option>`).join('')}</select>
        <select onchange="filterByChannel(this.value)" style="font-size:11px;padding:5px 8px"><option value="">전체 채널</option>${CHANNELS.map(c=>`<option>${c}</option>`).join('')}</select>
      </div>
    </div>
    <div class="kanban" id="kanban">
      ${STAGES.map((s,i)=>`
        <div class="kanban-col" data-stage="${i}">
          <div class="col-header">
            <div class="col-title"><span style="color:${STAGE_COLORS[i]}">●</span> ${s} <span class="col-count">${counts[i]}</span></div>
          </div>
          <div class="col-body" id="col-${i}">
            ${DB.candidates.filter(c=>c.stage===i).map(c=>renderKCard(c,today)).join('')}
          </div>
        </div>
      `).join('')}
    </div>`;
}

function renderKCard(c,today){
  const d=daysBetween(c.applyDate,today||fmt(new Date()));
  const delayed=d>14&&c.stage<5;
  const critical=d>30&&c.stage<5;
  const avgScore=c.scores.length?((c.scores.reduce((a,b)=>a+b,0)/c.scores.length).toFixed(1)):'';
  return `<div class="k-card ${critical?'critical':delayed?'delayed':''}" onclick="openDetail('${c.id}')">
    <div class="k-name">${c.name}</div>
    <div class="k-pos">${c.position}</div>
    <div class="k-meta">
      <span class="k-channel">${c.channel}</span>
      <span class="k-dday ${critical?'danger':delayed?'warn':''}">D+${d}</span>
      ${avgScore?`<span class="k-score"><span class="star">★</span>${avgScore}</span>`:''}
    </div>
  </div>`;
}

let pipeFilter={search:'',dept:'',channel:''};
function filterPipeline(v){pipeFilter.search=v.toLowerCase();applyPipeFilter()}
function filterByDept(v){pipeFilter.dept=v;applyPipeFilter()}
function filterByChannel(v){pipeFilter.channel=v;applyPipeFilter()}
function applyPipeFilter(){
  const today=fmt(new Date());
  STAGES.forEach((_,i)=>{
    const col=document.getElementById('col-'+i);
    if(!col)return;
    const filtered=DB.candidates.filter(c=>{
      if(c.stage!==i)return false;
      if(pipeFilter.search&&!c.name.includes(pipeFilter.search)&&!c.position.toLowerCase().includes(pipeFilter.search))return false;
      if(pipeFilter.dept&&c.dept!==pipeFilter.dept)return false;
      if(pipeFilter.channel&&c.channel!==pipeFilter.channel)return false;
      return true;
    });
    col.innerHTML=filtered.map(c=>renderKCard(c,today)).join('')||'<div class="empty-state" style="padding:20px"><p style="font-size:11px;color:var(--text3)">해당 없음</p></div>';
    col.previousElementSibling.querySelector('.col-count').textContent=filtered.length;
  });
}

// ─── DETAIL PANEL ───
function openDetail(id){
  selectedCandidate=DB.candidates.find(c=>c.id===id);
  if(!selectedCandidate)return;
  document.getElementById('panel-name').textContent=selectedCandidate.name+' · '+selectedCandidate.position;
  document.getElementById('panelOverlay').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
  switchPanelTab('profile',document.querySelector('.panel-tab'));
}
function closePanel(){
  document.getElementById('panelOverlay').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
}

function switchPanelTab(tab,el){
  document.querySelectorAll('.panel-tab').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active');
  const pc=document.getElementById('panel-content');
  const c=selectedCandidate;
  if(!c)return;
  const today=fmt(new Date());
  const d=daysBetween(c.applyDate,today);

  switch(tab){
    case 'profile':
      pc.innerHTML=`
        <div class="profile-top">
          <div class="avatar">${c.name[0]}</div>
          <div class="profile-info">
            <h3>${c.name}</h3>
            <div class="pos">${c.position} · ${c.dept}</div>
            <div class="stage-tag" style="margin-top:6px">
              <span class="tag tag-blue">${STAGES[c.stage]}</span>
              <span class="tag ${d>30?'tag-red':d>14?'tag-amber':'tag-green'}" style="margin-left:4px">D+${d}</span>
            </div>
          </div>
        </div>
        <div class="info-grid">
          <div class="info-item"><div class="il">연락처</div><div class="iv">${c.phone}</div></div>
          <div class="info-item"><div class="il">이메일</div><div class="iv" style="font-size:11px">${c.email}</div></div>
          <div class="info-item"><div class="il">지원 채널</div><div class="iv">${c.channel}</div></div>
          <div class="info-item"><div class="il">지원일</div><div class="iv">${c.applyDate}</div></div>
          <div class="info-item"><div class="il">현재 연봉</div><div class="iv">${c.curSalary.toLocaleString()}만원</div></div>
          <div class="info-item"><div class="il">희망 연봉</div><div class="iv">${c.expSalary.toLocaleString()}만원</div></div>
        </div>
        <div style="margin-bottom:16px">
          <div style="font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:600">경력 요약</div>
          <div style="background:var(--bg3);padding:12px;border-radius:var(--radius);font-size:12px">${c.career}</div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:16px">
          ${c.resume?`<a href="${c.resume}" target="_blank" class="btn btn-outline btn-sm">📄 이력서</a>`:''}
          ${c.portfolio?`<a href="${c.portfolio}" target="_blank" class="btn btn-outline btn-sm">🔗 포트폴리오</a>`:''}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${c.stage<5?`<button class="btn btn-primary btn-sm" onclick="moveStage('${c.id}',1)">→ 다음 단계</button>`:''}
          ${c.stage>0&&c.stage<5?`<button class="btn btn-outline btn-sm" onclick="moveStage('${c.id}',-1)">← 이전 단계</button>`:''}
          ${c.stage<5?`<button class="btn btn-danger btn-sm" onclick="dropCandidate('${c.id}')">탈락 처리</button>`:''}
          ${c.stage<5?`<button class="btn btn-outline btn-sm" onclick="moveToPool('${c.id}')">💎 탈렌트 풀로</button>`:''}
        </div>`;
      break;

    case 'scorecard':
      const avgScore=c.scores.length?(c.scores.reduce((a,b)=>a+b,0)/c.scores.length).toFixed(1):'—';
      pc.innerHTML=`
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
          <div class="sc-avg">${avgScore}</div>
          <div>
            <div style="font-size:13px;font-weight:600">종합 평가 점수</div>
            <div class="sc-interviewer">${c.stage>=2?'면접관: 김팀장, 이CTO':'면접 전 단계'}</div>
          </div>
        </div>
        <div class="sc-section">
          <div class="sc-title">평가 항목 (5점 만점)</div>
          ${SC_ITEMS.map((item,idx)=>`
            <div class="sc-row">
              <div class="sc-label">${item}</div>
              <div class="sc-stars">
                ${[1,2,3,4,5].map(s=>`<div class="sc-star ${(c.scores[idx]||0)>=s?'filled':''}" onclick="setScore('${c.id}',${idx},${s})">★</div>`).join('')}
              </div>
              <div style="width:24px;text-align:right;font-size:12px;font-weight:600;color:var(--accent)">${c.scores[idx]||'—'}</div>
            </div>
          `).join('')}
        </div>
        <div style="margin-top:16px">
          <div class="sc-title">면접 코멘트</div>
          <textarea style="width:100%;min-height:80px;font-size:12px" placeholder="면접 후 종합 코멘트를 남겨주세요...">${c.comment||''}</textarea>
          <button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="saveComment('${c.id}')">코멘트 저장</button>
        </div>`;
      break;

    case 'timeline':
      pc.innerHTML=`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div style="font-size:12px;font-weight:600">커뮤니케이션 & 전형 이력</div>
          <button class="btn btn-outline btn-sm" onclick="openCommModal('${c.id}')">+ 기록 추가</button>
        </div>
        <div class="timeline">
          ${(c.timeline||[]).slice().reverse().map(t=>`
            <div class="tl-item ${t.type}">
              <div class="tl-date">${t.date}</div>
              <div class="tl-text">${t.text}</div>
            </div>
          `).join('')}
        </div>`;
      break;

    case 'onboarding':
      if(c.stage!==5){
        pc.innerHTML=`<div class="empty-state"><div class="es-icon">🚀</div><p>입사 확정 단계에서 온보딩 체크리스트가 활성화됩니다.</p></div>`;
        return;
      }
      const done=c.onboarding.filter(o=>o.done).length;
      const total=c.onboarding.length;
      pc.innerHTML=`
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
          <div style="font-size:20px;font-weight:700;color:var(--green)">${Math.round(done/total*100)}%</div>
          <div>
            <div style="font-size:12px;font-weight:600">온보딩 진행률</div>
            <div style="font-size:11px;color:var(--text3)">${done}/${total} 완료</div>
          </div>
        </div>
        <div style="height:6px;background:var(--bg4);border-radius:99px;margin-bottom:20px;overflow:hidden">
          <div style="height:100%;width:${done/total*100}%;background:var(--green);border-radius:99px;transition:.3s"></div>
        </div>
        <div class="onboard-list">
          ${c.onboarding.map((o,i)=>`
            <div class="onboard-item">
              <div class="onboard-check ${o.done?'done':''}" onclick="toggleOnboard('${c.id}',${i})">${o.done?'✓':''}</div>
              <span style="${o.done?'text-decoration:line-through;color:var(--text3)':''}">${o.text}</span>
            </div>
          `).join('')}
        </div>`;
      break;
  }
}

// ─── SCHEDULE VIEW ───
function renderSchedule(el){
  const today=new Date();
  const mon=new Date(today);mon.setDate(today.getDate()-today.getDay()+1);
  const days=['월','화','수','목','금'];

  el.innerHTML=`
    <div class="stat-row" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat-card"><div class="label">이번 주 면접</div><div class="value">${DB.interviews.length}</div><div class="delta">건</div></div>
      <div class="stat-card"><div class="label">완료</div><div class="value" style="color:var(--green)">${DB.interviews.filter(iv=>iv.done).length}</div><div class="delta">건</div></div>
      <div class="stat-card"><div class="label">예정</div><div class="value" style="color:var(--amber)">${DB.interviews.filter(iv=>!iv.done).length}</div><div class="delta">건</div></div>
      <div class="stat-card"><div class="label">면접관</div><div class="value">${[...new Set(DB.interviews.map(iv=>iv.interviewer))].length}</div><div class="delta">명 참여</div></div>
    </div>
    <div class="schedule-week">
      ${days.map((day,i)=>{
        const dt=new Date(mon);dt.setDate(mon.getDate()+i);
        const dateStr=fmt(dt);
        const isToday=dateStr===fmt(today);
        const dayIvs=DB.interviews.filter(iv=>iv.date===dateStr).sort((a,b)=>a.time.localeCompare(b.time));
        return `
        <div class="day-col">
          <div class="day-header ${isToday?'today':''}">${day} ${dt.getMonth()+1}/${dt.getDate()}</div>
          <div class="day-body">
            ${dayIvs.length?dayIvs.map(iv=>`
              <div class="interview-card ${iv.done?'done':''}">
                <div class="iv-time">${iv.time}</div>
                <div class="iv-name">${iv.candidateName}</div>
                <div class="iv-pos">${iv.position}</div>
                <div style="margin-top:4px"><span class="tag tag-purple" style="font-size:9px">${iv.type}</span></div>
                <div class="iv-interviewer">👤 ${iv.interviewer} · ${iv.location}</div>
              </div>
            `).join(''):'<div style="text-align:center;padding:20px;color:var(--text3);font-size:11px">면접 없음</div>'}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

// ─── REPORTS VIEW ───
function renderReports(el){
  const total=DB.candidates.length;
  const hired=DB.candidates.filter(c=>c.stage===5).length;
  const offered=DB.candidates.filter(c=>c.stage>=4).length;
  const today=fmt(new Date());

  // Time-to-hire
  const hiredCands=DB.candidates.filter(c=>c.stage===5);
  const avgTTH=hiredCands.length?Math.round(hiredCands.reduce((s,c)=>s+daysBetween(c.applyDate,today),0)/hiredCands.length):0;

  // Funnel
  const funnelData=STAGES.map((_,i)=>DB.candidates.filter(c=>c.stage>=i).length);

  // Channel performance
  const chPerf=CHANNELS.map(ch=>{
    const all=DB.candidates.filter(c=>c.channel===ch);
    const ivd=all.filter(c=>c.stage>=2);
    const hrd=all.filter(c=>c.stage>=5);
    return {ch,total:all.length,interview:ivd.length,hired:hrd.length,
      ivRate:all.length?Math.round(ivd.length/all.length*100):0,
      hireRate:all.length?Math.round(hrd.length/all.length*100):0};
  }).sort((a,b)=>b.total-a.total);

  // Cost per hire (simulated)
  const costPerHire=hired?Math.round(1200/hired):0;

  // Offer acceptance
  const offerAccept=offered?Math.round(hired/offered*100):0;

  el.innerHTML=`
    <div class="stat-row" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat-card"><div class="label">Time-to-Hire</div><div class="value">${avgTTH}</div><div class="delta">일 (평균)</div></div>
      <div class="stat-card"><div class="label">Cost-per-Hire</div><div class="value">${costPerHire}</div><div class="delta">만원 / 인</div></div>
      <div class="stat-card"><div class="label">오퍼 수락률</div><div class="value" style="color:var(--green)">${offerAccept}%</div><div class="delta">${hired}/${offered} 수락</div></div>
      <div class="stat-card"><div class="label">총 채용 비용</div><div class="value">1,200</div><div class="delta">만원 (누적)</div></div>
      <div class="stat-card"><div class="label">입사 전환율</div><div class="value">${total?Math.round(hired/total*100):0}%</div><div class="delta">접수 대비</div></div>
    </div>
    <div class="report-grid">
      <div class="report-card">
        <h4>채용 퍼널</h4>
        <div class="rc-sub">단계별 도달 인원</div>
        <div class="funnel-chart">
          ${STAGES.map((s,i)=>{
            const pct=total?Math.round(funnelData[i]/total*100):0;
            return `<div class="funnel-row">
              <div class="funnel-label">${s}</div>
              <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${pct}%;background:${STAGE_COLORS[i]}">${pct}%</div></div>
              <div class="funnel-count">${funnelData[i]}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="report-card">
        <h4>채널별 성과</h4>
        <div class="rc-sub">채널별 지원·면접·합격 현황</div>
        <table class="ch-table">
          <thead><tr><th>채널</th><th class="num">지원</th><th class="num">면접</th><th class="num">합격</th><th>면접 전환</th><th>최종 전환</th></tr></thead>
          <tbody>
            ${chPerf.map(c=>`
              <tr>
                <td style="font-weight:600">${c.ch}</td>
                <td class="num">${c.total}</td>
                <td class="num">${c.interview}</td>
                <td class="num">${c.hired}</td>
                <td><div class="ch-bar"><div class="ch-bar-fill" style="width:${c.ivRate}%;background:var(--accent)"></div></div> <span style="font-size:10px;color:var(--text3)">${c.ivRate}%</span></td>
                <td><div class="ch-bar"><div class="ch-bar-fill" style="width:${c.hireRate}%;background:var(--green)"></div></div> <span style="font-size:10px;color:var(--text3)">${c.hireRate}%</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>

      <div class="report-card">
        <h4>부서별 채용 현황</h4>
        <div class="rc-sub">부서별 파이프라인 분포</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${DEPTS.map((dept,i)=>{
            const cnt=DB.candidates.filter(c=>c.dept===dept).length;
            const hiredCnt=DB.candidates.filter(c=>c.dept===dept&&c.stage===5).length;
            const pct=total?Math.round(cnt/total*100):0;
            const colors=['#3b82f6','#a855f7','#06b6d4','#f59e0b','#22c55e'];
            return `<div>
              <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px">
                <span style="font-weight:600">${dept}</span>
                <span style="color:var(--text3)">${cnt}명 (입사 ${hiredCnt})</span>
              </div>
              <div style="height:8px;background:var(--bg4);border-radius:4px;overflow:hidden">
                <div style="height:100%;width:${pct}%;background:${colors[i]};border-radius:4px"></div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="report-card">
        <h4>Source Quality 지수</h4>
        <div class="rc-sub">채널별 최종 전환율 비교</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
          ${chPerf.sort((a,b)=>b.hireRate-a.hireRate).map((c,i)=>{
            const rank=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
            return `<div style="display:flex;align-items:center;gap:10px">
              <span style="width:20px;text-align:center">${rank}</span>
              <span style="width:60px;font-size:11px;font-weight:600">${c.ch}</span>
              <div style="flex:1;height:20px;background:var(--bg4);border-radius:4px;overflow:hidden">
                <div style="height:100%;width:${c.hireRate}%;background:${CH_COLORS[CHANNELS.indexOf(c.ch)]};border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;min-width:30px">${c.hireRate}%</div>
              </div>
              <span style="width:40px;text-align:right;font-size:11px;color:var(--text3)">${c.total}명</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════
function moveStage(id,dir){
  const c=DB.candidates.find(x=>x.id===id);
  if(!c)return;
  const newStage=c.stage+dir;
  if(newStage<0||newStage>5)return;
  c.stage=newStage;
  c.timeline.push({date:fmt(new Date()),type:'stage',text:`${STAGES[newStage]} 단계로 ${dir>0?'전환':'복귀'}`});
  if(newStage===5&&!c.onboarding.length){
    c.onboarding=[
      {text:'장비(노트북/모니터) 준비',done:false},
      {text:'사내 계정 생성 (이메일/Slack/Jira)',done:false},
      {text:'취업규칙 서명',done:false},
      {text:'근로계약서 발급',done:false},
      {text:'팀 소개 미팅 일정',done:false},
      {text:'보안 교육 수료',done:false},
      {text:'첫 주 OJT 일정 공유',done:false}
    ];
  }
  saveDB();render();
  openDetail(id);
}

function dropCandidate(id){
  const c=DB.candidates.find(x=>x.id===id);
  if(!c||!confirm(`${c.name}님을 탈락 처리하시겠습니까?`))return;
  DB.candidates=DB.candidates.filter(x=>x.id!==id);
  saveDB();closePanel();render();
}

function moveToPool(id){
  const c=DB.candidates.find(x=>x.id===id);
  if(!c)return;
  DB.pool.push({
    id:'t'+Date.now(),name:c.name,position:c.position,
    tags:[c.stage>=2?'면접경험':'서류단계',c.dept],
    source:c.channel,addedDate:fmt(new Date()),
    note:`${STAGES[c.stage]} 단계에서 보류. 역량 재검토 대상.`
  });
  DB.candidates=DB.candidates.filter(x=>x.id!==id);
  saveDB();closePanel();render();
  alert(`${c.name}님이 탈렌트 풀에 추가되었습니다.`);
}

function setScore(id,idx,val){
  const c=DB.candidates.find(x=>x.id===id);
  if(!c)return;
  while(c.scores.length<=idx)c.scores.push(0);
  c.scores[idx]=val;
  saveDB();
  switchPanelTab('scorecard',document.querySelectorAll('.panel-tab')[1]);
}

function saveComment(id){
  const c=DB.candidates.find(x=>x.id===id);
  if(!c)return;
  const ta=document.querySelector('.panel-content textarea');
  if(ta)c.comment=ta.value;
  saveDB();
}

function toggleOnboard(id,idx){
  const c=DB.candidates.find(x=>x.id===id);
  if(!c||!c.onboarding[idx])return;
  c.onboarding[idx].done=!c.onboarding[idx].done;
  saveDB();
  switchPanelTab('onboarding',document.querySelectorAll('.panel-tab')[3]);
}

// ─── MODALS ───
function openAddCandidate(){document.getElementById('addModal').classList.add('open')}
function closeModal(){document.getElementById('addModal').classList.remove('open')}
function addCandidate(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){alert('이름을 입력해주세요');return}
  DB.candidates.push({
    id:'c'+Date.now(),name,
    position:document.getElementById('f-position').value,
    channel:document.getElementById('f-channel').value,
    dept:document.getElementById('f-dept').value,
    stage:0,applyDate:fmt(new Date()),
    phone:document.getElementById('f-phone').value||'미입력',
    email:document.getElementById('f-email').value||'미입력',
    curSalary:parseInt(document.getElementById('f-curSalary').value)||0,
    expSalary:parseInt(document.getElementById('f-expSalary').value)||0,
    career:document.getElementById('f-career').value||'',
    resume:document.getElementById('f-resume').value||'',
    portfolio:document.getElementById('f-portfolio').value||'',
    scores:[],timeline:[{date:fmt(new Date()),type:'stage',text:'지원서 접수'}],
    onboarding:[]
  });
  saveDB();closeModal();render();
  // Reset form
  ['f-name','f-phone','f-email','f-curSalary','f-expSalary','f-career','f-resume','f-portfolio'].forEach(id=>document.getElementById(id).value='');
}

let commTargetId=null;
function openCommModal(id){commTargetId=id;document.getElementById('cm-date').value=fmt(new Date());document.getElementById('commModal').classList.add('open')}
function closeCommModal(){document.getElementById('commModal').classList.remove('open')}
function saveComm(){
  const c=DB.candidates.find(x=>x.id===commTargetId);
  if(!c)return;
  c.timeline.push({
    date:document.getElementById('cm-date').value,
    type:'comm',
    text:document.getElementById('cm-type').value+' — '+document.getElementById('cm-content').value
  });
  saveDB();closeCommModal();
  switchPanelTab('timeline',document.querySelectorAll('.panel-tab')[2]);
}

function openAddPosting(){alert('공고 등록 폼 (데모에서는 미리 세팅된 공고를 사용합니다)')}

// ═══ INIT ═══
if(!loadDB()) generateDemoData();
render();
</script>
