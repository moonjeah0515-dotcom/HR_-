<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MOON HR · Smart Portal v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#f2f3f8; --surface:#ffffff; --border:#dde0ec; --text:#1a1d21; --sub:#6b7280;
      --ci-blue:#2878c0; --ci-purple:#6828a8; --ci-royal:#3C50C1; --ci-indigo:#441F7D;
      --ci-light-blue:#3AA9F6; --ci-light-purple:#A03BEF;
      --ok:#287858; --warn:#a07828; --err:#b83038;
      --radius:14px; --shadow:0 2px 12px rgba(0,0,0,0.07);
      --shadow-hover:0 8px 30px rgba(0,0,0,0.13);
      --t:0.22s cubic-bezier(.4,0,.2,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .layout{display:flex;min-height:100vh;}

    /* ── 사이드바 ── */
    .sidebar{width:220px;background:var(--ci-indigo);color:#fff;display:flex;flex-direction:column;padding:28px 0 20px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;}
    .sidebar-logo{padding:0 22px 24px;border-bottom:1px solid rgba(255,255,255,0.1);}
    .brand{font-size:1.25rem;font-weight:700;letter-spacing:-0.5px;color:#fff;}
    .brand-sub{font-size:0.68rem;color:rgba(255,255,255,0.5);margin-top:2px;letter-spacing:0.5px;}
    .brand-ver{display:inline-block;background:var(--ci-light-blue);color:#fff;font-size:0.6rem;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle;}
    .sidebar-nav{padding:16px 12px 0;flex:1;}
    .nav-section-label{font-size:0.62rem;font-weight:700;color:rgba(255,255,255,0.35);letter-spacing:1.5px;text-transform:uppercase;padding:0 10px;margin:14px 0 6px;}
    .nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:0.86rem;font-weight:500;color:rgba(255,255,255,0.72);transition:var(--t);margin-bottom:2px;border:none;background:none;width:100%;text-align:left;}
    .nav-item:hover,.nav-item.active{background:rgba(255,255,255,0.13);color:#fff;}
    .nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .sidebar-footer{padding:14px 22px 0;border-top:1px solid rgba(255,255,255,0.1);font-size:0.7rem;color:rgba(255,255,255,0.32);}

    /* ── 메인 ── */
    .main{flex:1;padding:36px 40px;overflow-x:hidden;}
    .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;}
    .topbar h1{font-size:1.55rem;font-weight:700;letter-spacing:-0.8px;}
    .topbar-right{display:flex;align-items:center;gap:9px;}
    .date-chip{font-family:'DM Mono',monospace;font-size:0.76rem;color:var(--sub);background:var(--surface);border:1px solid var(--border);padding:4px 11px;border-radius:20px;}
    .badge-v2{font-size:0.68rem;font-weight:700;padding:4px 10px;border-radius:20px;background:#e8f4ff;color:var(--ci-royal);border:1px solid #c5dcf5;}

    /* 탭 */
    .tab-bar{display:flex;gap:4px;margin-bottom:28px;background:var(--surface);padding:4px;border-radius:12px;border:1px solid var(--border);width:fit-content;}
    .tab-btn{padding:8px 18px;border-radius:9px;border:none;background:transparent;font-family:'Noto Sans KR',sans-serif;font-size:0.84rem;font-weight:600;color:var(--sub);cursor:pointer;transition:var(--t);}
    .tab-btn.active{background:var(--ci-royal);color:#fff;box-shadow:0 2px 8px rgba(60,80,193,0.25);}
    .tab-btn:hover:not(.active){background:var(--bg);color:var(--text);}

    /* 검색 */
    .search-wrap{margin-bottom:26px;position:relative;}
    .search-wrap input{width:100%;padding:12px 18px 12px 44px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:0.9rem;font-family:'Noto Sans KR',sans-serif;background:var(--surface);color:var(--text);transition:var(--t);outline:none;}
    .search-wrap input:focus{border-color:var(--ci-light-blue);box-shadow:0 0 0 3px rgba(58,169,246,0.13);}
    .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none;}

    /* 섹션 & 카드 */
    .section{margin-bottom:36px;}
    .section-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .cat-badge{display:inline-flex;align-items:center;gap:7px;font-size:0.8rem;font-weight:700;padding:4px 12px;border-radius:20px;color:#fff;}
    .count-chip{font-size:0.75rem;color:var(--sub);}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 19px;transition:var(--t);display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden;}
    .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:transparent;}
    .card-top{display:flex;align-items:center;gap:10px;}
    .card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
    .card-name{font-size:0.92rem;font-weight:700;letter-spacing:-0.3px;line-height:1.3;}
    .card-desc{font-size:0.78rem;color:var(--sub);line-height:1.5;}
    .card-memo{background:#f8fafc;border:1px solid #eef0f2;border-radius:8px;padding:8px 11px;font-family:'DM Mono',monospace;font-size:0.74rem;color:#4b5563;line-height:1.65;}
    .pw-val{color:transparent;text-shadow:0 0 7px rgba(0,0,0,0.4);cursor:pointer;transition:0.2s;user-select:none;}
    .pw-val:hover,.pw-val.revealed{color:var(--ci-royal);text-shadow:none;}
    .pw-label{color:var(--sub);}
    .copy-btn{display:inline-flex;align-items:center;gap:4px;font-size:0.7rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 7px;cursor:pointer;margin-left:6px;font-family:'Noto Sans KR',sans-serif;color:var(--sub);transition:var(--t);}
    .copy-btn:hover{background:var(--ci-royal);color:#fff;border-color:transparent;}
    .card-link-btn{display:inline-flex;align-items:center;gap:5px;font-size:0.76rem;font-weight:600;color:var(--ci-royal);margin-top:auto;text-decoration:none;transition:var(--t);}
    .card-link-btn:hover{opacity:0.7;}

    /* 연락처 테이블 탭 */
    .contact-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
    .contact-table th{background:var(--ci-royal);color:#fff;padding:10px 14px;font-size:0.78rem;font-weight:600;text-align:left;}
    .contact-table td{padding:10px 14px;font-size:0.82rem;border-bottom:1px solid var(--border);}
    .contact-table tr:last-child td{border-bottom:none;}
    .contact-table tr:hover td{background:#f5f7ff;}
    .cat-row td{background:#f0f2f8;font-weight:700;font-size:0.78rem;color:var(--ci-royal);}

    /* 연간 일정 탭 */
    .annual-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
    .month-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
    .month-header{background:var(--ci-royal);color:#fff;padding:10px 16px;font-size:0.9rem;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
    .month-header .evt-cnt{font-size:0.72rem;background:rgba(255,255,255,0.2);padding:2px 8px;border-radius:10px;}
    .event-item{display:flex;align-items:flex-start;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:0.82rem;}
    .event-item:last-child{border-bottom:none;}
    .event-day{font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--sub);min-width:28px;padding-top:1px;}
    .event-content{flex:1;line-height:1.4;}

    /* 회사정보 탭 */
    .info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
    .info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
    .info-card-title{font-size:0.8rem;font-weight:700;color:var(--ci-royal);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--ci-light-blue);}
    .info-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:0.85rem;}
    .info-row:last-child{border-bottom:none;}
    .info-label{color:var(--sub);font-size:0.8rem;}
    .info-value{font-weight:500;font-family:'DM Mono',monospace;font-size:0.8rem;}

    /* 빈/에러 상태 */
    .empty-state{text-align:center;padding:60px 20px;color:var(--sub);}
    .empty-state .icon{font-size:2.8rem;margin-bottom:12px;}
    .tab-panel{display:none;}
    .tab-panel.active{display:block;}

    @media(max-width:768px){.sidebar{display:none;}.main{padding:20px 16px;}.grid{grid-template-columns:1fr 1fr;}.tab-btn{padding:7px 12px;font-size:0.78rem;}}
    @media(max-width:480px){.grid{grid-template-columns:1fr;}.annual-grid{grid-template-columns:1fr;}}
  </style>
</head>

<script>
// ── 초기화 ──────────────────────────────────────────────
document.getElementById('today-date').textContent =
  new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'});

let activeCat = '';
let activeTab = 'idpw';

// 사이드바 카테고리 nav 생성
const navCats = document.getElementById('nav-cats');
IDPW_CATS.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'nav-item';
  btn.innerHTML = `<span class="nav-dot" style="background:${cat.color};"></span> ${cat.name}`;
  btn.onclick = () => {
    if(activeTab !== 'idpw') switchTab('idpw', null, 'tab-idpw');
    filterCat(cat.name, btn);
  };
  navCats.appendChild(btn);
});

// ── 탭 전환 ─────────────────────────────────────────────
function switchTab(tab, navEl, tabBtnId) {
  activeTab = tab;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  // topbar title
  const titles = {idpw:'계정 / 비밀번호 관리',annual:'연간 업무일정',contacts:'연락처',company:'회사 기본정보'};
  document.getElementById('page-title').textContent = titles[tab];
  // tab buttons sync
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    const tabs = ['idpw','annual','contacts','company'];
    b.classList.toggle('active', tabs[i]===tab);
  });
  // nav sidebar sync
  if(navEl) {
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    navEl.classList.add('active');
  }
  // 최초 렌더
  if(tab==='annual' && !document.getElementById('annual-content').innerHTML) renderAnnual();
  if(tab==='contacts' && !document.getElementById('contacts-content').innerHTML) renderContacts();
  if(tab==='company' && !document.getElementById('company-content').innerHTML) renderCompany();
}

// ── IDPW 카테고리 필터 ──────────────────────────────────
function filterCat(catName, el) {
  activeCat = catName;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  renderIdpw();
}

// ── IDPW 렌더링 ─────────────────────────────────────────

  const sections = document.getElementById('idpw-sections');
  sections.innerHTML='';
  const catsToShow = activeCat ? IDPW_CATS.filter(c=>c.name===activeCat) : IDPW_CATS;
  let total=0;
  catsToShow.forEach(cat => {
    const items = IDPW_DATA.filter(r =>
      r.cat===cat.name &&
      (!q || [r.name,r.id,r.memo,r.url].some(v=>v.toLowerCase().includes(q)))
    );
    if(!items.length) return;
    total+=items.length;
    const sec=document.createElement('div'); sec.className='section';
    sec.innerHTML=`
      <div class="section-header">
        <span class="cat-badge" style="background:${cat.color}">${cat.emoji} ${cat.name}</span>
        <span class="count-chip">${items.length}개</span>
      </div>
      <div class="grid" id="grid-${cat.name.replace(/\s/g,'_')}"></div>`;
    sections.appendChild(sec);
    const grid=sec.querySelector(`[id="grid-${cat.name.replace(/\s/g,'_')}"]`);
    items.forEach(row=>grid.appendChild(makeCard(row,cat)));
  });
  if(!total) sections.innerHTML=`<div class="empty-state"><div class="icon">🔍</div><p>검색 결과가 없어요</p></div>`;
}

function makeCard(row, cat) {
  const card=document.createElement('div'); card.className='card';
  // 컬러바
  const bar=document.createElement('div');
  bar.style.cssText=`position:absolute;top:0;left:0;width:3px;height:100%;background:${cat.color};border-radius:3px 0 0 3px;`;
  card.appendChild(bar);
  // 상단
  const top=document.createElement('div'); top.className='card-top';
  const iconMap={'회사정보':'🏢','기본계정':'🔑','회사운영사이트':'🖥️','4대보험':'🛡️','관공서':'🏛️','금융기관':'🏦','정부과제':'📋','리조트':'🏖️','계약 및 세금계산서':'📄','인사업무':'👥','총무업무':'🔧','영업지원':'📊'};
  top.innerHTML=`<div class="card-icon" style="background:${cat.color}22;color:${cat.color}">${iconMap[cat.name]||'🔗'}</div><div class="card-name">${esc(row.name)}</div>`;
  card.appendChild(top);
  // 설명 (memo)
  if(row.memo){const d=document.createElement('div');d.className='card-desc';d.textContent=row.memo;card.appendChild(d);}
  // 메모박스
  const memoLines=[];
  if(row.id)  memoLines.push(`<span class="pw-label">ID: </span>${esc(row.id)}<button class="copy-btn" onclick="copyText('${row.id.replace(/'/g,"\'")}',this)">복사</button>`);
  if(row.pw)  memoLines.push(`<span class="pw-label">PW: </span><span class="pw-val" onclick="togglePw(this,'${row.pw.replace(/'/g,"\'")}',event)">${esc(row.pw)}</span><button class="copy-btn" onclick="copyText('${row.pw.replace(/'/g,"\'")}',this)">복사</button>`);
  if(memoLines.length){const m=document.createElement('div');m.className='card-memo';m.innerHTML=memoLines.join('<br>');card.appendChild(m);}
  // URL 버튼
  if(row.url && row.url.startsWith('http')){
    const btn=document.createElement('a');btn.className='card-link-btn';
    btn.href=row.url;btn.target='_blank';btn.rel='noopener noreferrer';
    btn.textContent='바로가기 →'; card.appendChild(btn);
  } else if(row.url && !row.id && !row.pw) {
    const d2=document.createElement('div');d2.className='card-desc';d2.textContent=row.url;card.appendChild(d2);
  }
  card.addEventListener('mouseenter',()=>{card.style.boxShadow=`0 8px 30px ${cat.color}25`;});
  card.addEventListener('mouseleave',()=>{card.style.boxShadow='';});
  return card;
}

// ── 연간일정 렌더링 ──────────────────────────────────────
function renderAnnual() {
  const monthMap={};
  ANNUAL.forEach(e=>{ if(!monthMap[e.month]) monthMap[e.month]=[]; monthMap[e.month].push(e); });
  const all=document.getElementById('annual-content');
  const grid=document.createElement('div'); grid.className='annual-grid';
  const monthOrder=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const curMonth=new Date().getMonth()+1+'월';
  monthOrder.forEach(m=>{
    if(!monthMap[m]) return;
    const evts=monthMap[m];
    const mc=document.createElement('div'); mc.className='month-card';
    const isThis=m===curMonth;
    mc.innerHTML=`<div class="month-header" style="${isThis?'background:var(--ci-light-blue);':''}">
      <span>${m} ${isThis?'<span style="font-size:0.65rem;opacity:0.8;">◀ 이번달</span>':''}</span>
      <span class="evt-cnt">${evts.length}건</span>
    </div>`;
    evts.forEach(e=>{
      const item=document.createElement('div'); item.className='event-item';
      item.innerHTML=`<span class="event-day">${e.day?e.day+'일':''}</span><span class="event-content">${esc(e.content)}</span>`;
      mc.appendChild(item);
    });
    grid.appendChild(mc);
  });
  all.appendChild(grid);
}

// ── 연락처 렌더링 ────────────────────────────────────────
function renderContacts() {
  const cont=document.getElementById('contacts-content');
  const table=document.createElement('table'); table.className='contact-table';
  table.innerHTML=`<thead><tr>
    <th>분류</th><th>거래처명</th><th>사무실/연락처</th><th>담당자</th><th>담당업무</th>
  </tr></thead>`;
  const tbody=document.createElement('tbody');
  let prevCat='';
  CONTACTS.forEach(c=>{
    if(c.cat!==prevCat){
      const r=document.createElement('tr'); r.className='cat-row';
      r.innerHTML=`<td colspan="5">▸ ${esc(c.cat)}</td>`;
      tbody.appendChild(r); prevCat=c.cat;
    }
    const catEmoji={'관공서':'🏛️','금융기관':'🏦','빌딩':'🏢','통신사':'📡','거래처':'🤝'};
    const r=document.createElement('tr');
    r.innerHTML=`<td>${catEmoji[c.cat]||'📌'}</td><td><strong>${esc(c.name)}</strong></td>
    <td style="font-family:'DM Mono',monospace;font-size:0.78rem;">${esc(c.tel)||'-'}</td>
    <td>${esc(c.mgr)||'-'}</td><td style="color:var(--sub)">${esc(c.task)||'-'}</td>`;
    tbody.appendChild(r);
  });
  table.appendChild(tbody);
  cont.appendChild(table);
}

// ── 회사정보 렌더링 ──────────────────────────────────────
function renderCompany() {
  const companyInfo = IDPW_DATA.filter(r=>r.cat==='회사정보');
  const basicAcct   = IDPW_DATA.filter(r=>r.cat==='기본계정');
  const cont=document.getElementById('company-content');
  cont.innerHTML=`<div class="info-grid">
    <div class="info-card">
      <div class="info-card-title">🏢 회사 기본정보</div>
      ${companyInfo.map(r=>`<div class="info-row">
        <span class="info-label">${esc(r.name)}</span>
        <span class="info-value">${esc(r.url||r.id||'-')}</span>
      </div>`).join('')}
    </div>
    <div class="info-card">
      <div class="info-card-title">🔑 기본 계정 정보</div>
      ${basicAcct.map(r=>`<div class="info-row">
        <span class="info-label">${esc(r.name)}</span>
        <span class="info-value" style="font-size:0.75rem;">${esc(r.url||r.id||'-')}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

// ── 유틸 ─────────────────────────────────────────────────
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function togglePw(el, pw, e) {
  e.stopPropagation();
  el.classList.toggle('revealed');
}

function copyText(txt, btn) {
  navigator.clipboard.writeText(txt).then(()=>{
    const orig=btn.textContent; btn.textContent='✓ 복사됨';
    btn.style.background='var(--ok)'; btn.style.color='#fff'; btn.style.borderColor='transparent';
    setTimeout(()=>{btn.textContent=orig;btn.style.background='';btn.style.color='';btn.style.borderColor='';},1500);
  });
}

// ── 초기 렌더 ────────────────────────────────────────────
renderIdpw();
</script>
